name: CI

# 給与計算の単体テストと、法定データのドリフトガードを毎push/PRで実行。
#  ・test: tests/run.js(実リテラル+回帰・依存なしのnode製ハーネス)
#  ・integration: tests/integration.mjs=jsdomで本物のapp.jsを読み込み配線/UI/状態/描画を検証(RC1対策)
#  ・statutory-drift: scripts/verify-statutory.mjs で lib のハードコード値 == 中央Supabase statutory を検証。
#    不一致(=ドリフト)なら赤。中央取得不可(オフライン等)は緑スキップ。anon公開鍵でREST読取のみ(秘密情報不要)。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests (tests/run.js・依存なし)
        run: node tests/run.js
      - name: Install test deps (jsdom)
        run: npm install --no-audit --no-fund
      - name: Integration tests (tests/integration.mjs・app.js層をjsdomで)
        run: node tests/integration.mjs
      - name: Full-feature real-data verification (①全機能を実データで検証・給与全パターン)
        run: node tests/payroll-patterns.mjs
      - name: UI smoke (②全ボタンをクリックしてJS例外0・jsdom)
        run: node tests/ui-smoke.mjs
      - name: Cloud sync (保存層・Supabaseモックで全項目保存/差分削除ガード/保存成否)
        run: node tests/cloud-sync.mjs
      - name: Pagination (1000件超が黙って欠落しない=全件ページング・賃金台帳/年調/明細/法定)
        run: node tests/pagination.test.mjs
      - name: Meisai store (Web明細 公開一覧フィルタ＋削除時リンク失効・docs物理削除しない)
        run: node tests/meisai-store.mjs
      - name: Login signup分岐 (メール確認ON=確認メール待機画面・確認OFF即ログインは回帰なし)
        run: node tests/exally-login.test.mjs
      - name: Golden freeze guard (移設前の真値と入力fixtureが作り直されていないか=SHA256照合)
        run: node tests/golden-immutable.test.mjs
      - name: Headless guard (lib/ がDOM・通信・非決定性に依存しない=静的+毒化グローバル実行の二重)
        run: node scripts/verify-headless.mjs
      - name: Ops golden parity (★1円一致★ 移設前ゴールデン vs ops/payroll.monthly・Excelはセル単位)
        run: node tests/ops-golden-parity.test.mjs
      - name: Ops statutory (官公値の実数リテラル・Excel同一ソース・テストAPI非露出の静的ガード)
        run: node tests/ops-payroll-monthly.test.mjs
      - name: Law switchpoints (健保R7→R8/支援金2026-04/雇用保険年度/最賃年度の境界前後)
        run: node tests/law-switchpoints.test.mjs
      - name: Periods golden (期間分割K2が移設前と一致・月末28/29/30/31・月またぎ・日払週払は分割しない)
        run: node tests/periods-golden.test.mjs
      - name: Input fixture reproducibility (入力fixtureが生成スクリプトと一致するか)
        run: node scripts/make-input-fixture.mjs --check
      - name: Periods fixture reproducibility (期間fixtureが生成スクリプトと一致するか)
        run: node scripts/make-periods-fixture.mjs --check
      - name: Cache-buster stamp guard (全HTMLが現在の内容ハッシュ ?v= で貼られているか=貼り忘れ検知)
        run: node scripts/stamp-build.mjs --check
      - name: Statutory drift guard (lib == 中央statutory)
        run: node scripts/verify-statutory.mjs
