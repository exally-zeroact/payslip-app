name: CI

# 給与計算の単体テストと、法定データのドリフトガードを毎push/PRで実行。
#  ・test: tests/run.js(実リテラル+回帰・依存なしのnode製ハーネス)
#  ・integration: tests/integration.mjs=jsdomで本物のapp.jsを読み込み配線/UI/状態/描画を検証(RC1対策)
#  ・statutory-drift: scripts/verify-statutory.mjs で lib のハードコード値 == 中央Supabase statutory を検証。
#    不一致(=ドリフト)なら赤。中央取得不可(オフライン等)は緑スキップ。anon公開鍵でREST読取のみ(秘密情報不要)。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests (tests/run.js・依存なし)
        run: node tests/run.js
      - name: Install test deps (jsdom)
        run: npm install --no-audit --no-fund
      - name: Integration tests (tests/integration.mjs・app.js層をjsdomで)
        run: node tests/integration.mjs
      - name: Full-feature real-data verification (①全機能を実データで検証・給与全パターン)
        run: node tests/payroll-patterns.mjs
      - name: UI smoke (②全ボタンをクリックしてJS例外0・jsdom)
        run: node tests/ui-smoke.mjs
      - name: Cloud sync (保存層・Supabaseモックで全項目保存/差分削除ガード/保存成否)
        run: node tests/cloud-sync.mjs
      - name: Pagination (1000件超が黙って欠落しない=全件ページング・賃金台帳/年調/明細/法定)
        run: node tests/pagination.test.mjs
      - name: Meisai store (Web明細 公開一覧フィルタ＋削除時リンク失効・docs物理削除しない)
        run: node tests/meisai-store.mjs
      - name: Cache-buster stamp guard (全HTMLが現在の内容ハッシュ ?v= で貼られているか=貼り忘れ検知)
        run: node scripts/stamp-build.mjs --check
      - name: Statutory drift guard (lib == 中央statutory)
        run: node scripts/verify-statutory.mjs
