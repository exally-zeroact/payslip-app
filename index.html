<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>給与明細 — ZEROACT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="appbar">
  <div class="logo">給与明細</div>
  <div class="appbar-sub">ZEROACT</div>
  <div class="appbar-month">
    <label>対象月</label>
    <input id="g-month" type="month" class="finput finput-sm">
  </div>
</header>

<main class="main">
  <!-- ① 設定 -->
  <section class="screen active" id="scr-settings">
    <h2 class="scr-title">設定</h2>
    <div class="seg" id="set-seg">
      <button class="seg-b on" data-set="company">会社情報</button>
      <button class="seg-b" data-set="emp">従業員マスタ</button>
    </div>
    <div id="set-company">
      <div class="card">
        <div class="card-h">会社情報</div>
        <div class="frow"><div class="flabel">会社名</div><input id="c-name" class="finput" placeholder="株式会社 ゼロアクト"></div>
        <div class="frow"><div class="flabel">住所<span class="hint2">任意</span></div><input id="c-addr" class="finput" placeholder="（任意）"></div>
        <div class="frow2">
          <div class="frow"><div class="flabel">締め日</div><input id="c-close" class="finput" placeholder="末日"></div>
          <div class="frow"><div class="flabel">支給日</div><input id="c-payday" class="finput" placeholder="翌25日"></div>
        </div>
        <p class="hint" id="store-mode"></p>
      </div>
    </div>
    <div id="set-emp" style="display:none">
      <div id="emp-list"></div>
      <button class="btn-add" id="b-add-emp">＋ 従業員を追加</button>
    </div>
  </section>

  <!-- ② 入力 -->
  <section class="screen" id="scr-input">
    <h2 class="scr-title">入力 <span class="scr-sub" id="in-month"></span></h2>
    <p class="hint">従業員をタップすると当月の変動値（勤怠・時数・変動手当）を入力できます。法定控除（健保/厚年/介護/雇用/所得税）は自動計算されます。</p>
    <div id="input-list"></div>
  </section>

  <!-- ③ 一覧/集計 -->
  <section class="screen" id="scr-list">
    <div class="seg">
      <button class="seg-b on" data-view="list">一覧</button>
      <button class="seg-b" data-view="sum">集計</button>
    </div>
    <div id="view-list"></div>
    <div id="view-sum" style="display:none"></div>
  </section>

  <!-- ④ 印刷/PDF -->
  <section class="screen" id="scr-print">
    <h2 class="scr-title">印刷 / PDF</h2>
    <div class="card">
      <div class="frow2">
        <div><label>月で選ぶ</label><input id="p-month" type="month" class="finput"></div>
        <div><label>従業員で選ぶ</label><select id="p-emp" class="finput"></select></div>
      </div>
      <div class="frow"><label>明細の色（テーマ）</label>
        <span class="theme-row" id="theme-row"></span>
      </div>
      <div class="btn-row">
        <button class="btn-primary" id="b-print">印刷</button>
        <button class="btn-ghost" id="b-pdf">PDFで保存/送付</button>
      </div>
    </div>
    <div class="preview-wrap"><iframe id="frame" title="プレビュー"></iframe></div>
  </section>
</main>

<nav class="botnav">
  <button class="bn on" data-scr="scr-settings"><span class="bn-i">⚙</span><span class="bn-l">設定</span></button>
  <button class="bn" data-scr="scr-input"><span class="bn-i">✎</span><span class="bn-l">入力</span></button>
  <button class="bn" data-scr="scr-list"><span class="bn-i">▤</span><span class="bn-l">一覧/集計</span></button>
  <button class="bn" data-scr="scr-print"><span class="bn-i">⎙</span><span class="bn-l">印刷</span></button>
</nav>

<div class="help-ov" id="help-ov">
  <div class="help-card">
    <div class="help-t" id="help-t"></div>
    <div class="help-b" id="help-b"></div>
    <button class="help-x" id="help-x">閉じる</button>
  </div>
</div>

<script src="lib/shotokuzei-hyou.js"></script>
<script src="lib/shakaihoken-hyo.js"></script>
<script src="lib/koyohoken-ritsu.js"></script>
<script src="lib/payroll-calc.js"></script>
<script src="lib/shotokuzei-densan.js"></script>
<script src="lib/calc.js"></script>
<script src="lib/warimashi.js"></script>
<script src="lib/select.js"></script>
<script src="js/render.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
